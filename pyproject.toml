[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "casefile-ai"
version = "1.1.0"
description = "Local-first, source-traceable case-file analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jieba==0.42.1",
  "mcp[cli]==2.2.0",
  "numpy>=2.2,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<26",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]
ocr = [
  "onnxruntime>=1.22,<2",
  "rapidocr>=3.4,<4",
]
embeddings = [
  "sentence-transformers>=5.1,<6",
]

[project.scripts]
casefile-ai = "casefile_ai.interfaces.cli.main:app"
casefile-ai-mcp = "casefile_ai.interfaces.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile_ai"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "casefile_ai/resources/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["casefile_ai"]
